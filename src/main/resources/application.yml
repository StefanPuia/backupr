spring:
  application:
    name: backupr
    version: 1.1
  main:
    banner-mode: off
    log-startup-info: false
  shell:
#    interactive:
#      enabled: true
    noninteractive:
      primary-command: backup -v
  profiles:
    active: "${SPRING_PROFILES_ACTIVE:}"

logging:
  level:
    root: warn
    co.uk.stefanpuia.backupr: warn
    org.jline: error
    com.azure.core.http.netty.implementation.NettyUtility: warn